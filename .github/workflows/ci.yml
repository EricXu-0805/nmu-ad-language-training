# 合并前的自动检查。Python/Node 依赖由 workflow 先准备，判据则调用
# scripts/ci_gate.sh 的共享 suite；该脚本不会改写当前 Python 或 node_modules。
# 因此同一套核心检查在本地和 CI 不会各写一份。
#
# 这个文件只是门禁定义，不能证明 GitHub 已把它设为 required check，也不能证明
# 当前 SHA 曾经跑绿；这两件事必须以仓库设置和对应 SHA 的云端运行证据为准。
name: CI

on:
  # 分支上的提交只由 pull_request 那次跑：strict 分支保护要求 PR 先与 main 同步，测的就是
  # 合进去的那棵树，分支 push 再跑一遍是同一棵树的第二份分钟账单（仓库私有后按分钟计）。
  # 没开 PR 的分支因此不跑 CI，要测就开草稿 PR。main 的 push 必须留着：上线脚本只从
  # main 上该 SHA 的 push run 取产物。
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC 重跑一次。依赖没动，OSV 里的世界会动——
    # 只在 push 时扫等于假设漏洞只在改代码时出现。
    - cron: "0 2 * * 1"

permissions:
  contents: read

# 同一分支或同一 PR 来了新提交，旧提交那次还在跑的就作废。main 不取消：上线脚本按
# SHA 取 main 上 push run 的产物，每个合进 main 的 SHA 都要有自己跑完的那一次。
# 同组只留一个排队的 run，新排进来的会顶掉旧排队的（cancel-in-progress=false 也一样），
# 所以 main 按 SHA 分组，每个 SHA 自成一组。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 第三方 action 一律按 commit SHA 钉，tag 只作注释。理由和底座镜像钉 digest
# 是同一条：tag 可以被移动，被移动之后没有任何本地信号。这些 action 在 CI 里
# 拿得到仓库内容，是供应链的一部分，不能比依赖松。

jobs:
  backend:
    # main 的 push 与每周定时不重跑测试：进 main 的树已由 PR run 测过，这两种事件只要上线
    # 产物和新通告扫描（image、supply-chain）。跳过的 job 记 skipped，整次 run 仍是 success；
    # job 级 if 先于矩阵展开求值，main 上只会有一条 backend、没有 backend (3.12)/(3.14)——
    # 必需检查只在更新 main 那一刻核对被推的 SHA，那时这次 run 还没开始，不受影响。
    # 只写「跳过哪些事件」，新加的触发默认照跑；pull_request 绝不能进来：分支保护把跳过算通过。
    # 要在 main 上完整重跑，用 workflow_dispatch。
    if: github.event_name != 'push' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 卡住的一条腿不设上限会跑满默认 360 分钟（私有仓库按分钟计）；PR 上全量约 15–22 分钟。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = 容器底座；3.14 = 裸机生产机上自编译的解释器。
        # 只验一个等于放任另一条路悄悄漂。
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: 按哈希锁装运行期依赖
        run: pip install --require-hashes -r requirements-deploy.lock.txt
      - name: 装测试工具（不在运行期锁里，故单独一步）
        # 版本钉死,理由与 action 按 SHA 钉同一条:未钉的最新 ruff 会带着本地
        # 从未验证过的新规则进来(首绿尝试就是这样红的——I001 只在 CI 出现)。
        # 升级 = 本地先升、先绿,再改这里。
        run: pip install pytest==9.1.1 pytest-xdist==3.8.0 ruff==0.15.15
      - name: 共享后端门（ruff + pytest）
        run: NMU_GATE_PYTHON=python scripts/ci_gate.sh --only backend
      - name: 生成 240 场机械容量验收回执（留档用）
        if: matrix.python == '3.12'
        run: |
          receipt_dir="$RUNNER_TEMP/quality-scale-receipt"
          install -d -m 700 "$receipt_dir"
          python -m harness.quality_release_scale --profile full \
            --receipt "$receipt_dir/quality-release-scale.json"
      - name: 归档 240 场验收回执
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: quality-release-scale-python-3.12
          path: ${{ runner.temp }}/quality-scale-receipt/quality-release-scale.json
          if-no-files-found: error

  frontend:
    # 条件与理由同 backend。
    if: github.event_name != 'push' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          # 必须与本地共享门一致为 25.x：测试用 node --test 直接跑 .ts（原生类型剥离），且渲染类
          # 测试用到 node 25 起默认可用的 localStorage（24 上直接 ReferenceError，
          # 首绿尝试就是这么红的）。本地验证环境即 node 25。
          # 镜像底座是 node 22，那一层只跑 vite build，不跑这些测试。
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: 共享前端门（含 Node major 对齐）
        run: scripts/ci_gate.sh --only frontend

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - name: 共享供应链门（SBOM + OSV + 锁自洽）
        run: NMU_GATE_PYTHON=python scripts/ci_gate.sh --only supply-chain
      - name: 归档 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    # 镜像里的系统包 OSV 查不了(它认不了 OCI digest)，得在构建产物上扫。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: 构建镜像（底座 digest 已在 Dockerfile 里钉死）
        run: docker build -t nmu-platform:ci .
      - name: 扫镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: nmu-platform:ci
          cache-dir: ${{ runner.temp }}/trivy-cache
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: 使用固定安全工具链重建同版本 HTTPS 网关
        run: bash scripts/build_caddy_release.sh --output "$RUNNER_TEMP/nmu-edge-release"
      - name: 在 Linux 上验证重建网关和仓库代理配置
        env:
          SITE_ADDRESS: http://127.0.0.1:8080
        run: |
          "$RUNNER_TEMP/nmu-edge-release/caddy" version
          "$RUNNER_TEMP/nmu-edge-release/caddy" validate --adapter caddyfile --config Caddyfile
      - name: 验证实际网关的本地 HTTPS 反代与请求边界
        run: >-
          python scripts/smoke_caddy_release.py
          --binary "$RUNNER_TEMP/nmu-edge-release/caddy" --source-root "$GITHUB_WORKSPACE"
      - name: 扫描实际网关二进制和 Go 标准库
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          # fs mode disables individual Go binary analysis; rootfs scans the
          # compiled artifact (the coverage check below rejects empty reports).
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/nmu-edge-release
          cache-dir: ${{ runner.temp }}/trivy-cache
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/nmu-edge-scan.json
          list-all-pkgs: true
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          # 只放行逐条登记、带到期日的条目;理由与到期规矩写在文件里。
          trivyignores: security/trivy-gateway.trivyignore
      - name: 确认扫描确实识别了网关和实际 Go 版本
        run: >-
          python scripts/verify_caddy_release_scan.py "$RUNNER_TEMP/nmu-edge-scan.json"
          --go-build-info "$RUNNER_TEMP/nmu-edge-release/go-build-info.txt"
          --revision "$GITHUB_SHA"
      - name: 提取已扫描镜像的前端发布构件
        run: |
          artifact_dir="$RUNNER_TEMP/nmu-release-artifacts"
          install -d -m 700 "$artifact_dir"
          docker create --name nmu-ci-dist nmu-platform:ci
          docker cp nmu-ci-dist:/app/web/dist "$artifact_dir/dist"
          docker rm nmu-ci-dist
          python scripts/verify_browser_dist.py --source-root "$GITHUB_WORKSPACE" "$artifact_dir/dist"
          docker image inspect nmu-platform:ci --format '{{.Id}}' > "$artifact_dir/image-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/source-commit.txt"
          cp -R "$RUNNER_TEMP/nmu-edge-release" "$artifact_dir/caddy"
          cp "$RUNNER_TEMP/nmu-edge-scan.json" "$artifact_dir/caddy/trivy.json"
      - name: 归档同一镜像生成的前端构件与来源
        # 只有 push（即 main）run 上传：上线脚本只按 --event push 取该 SHA 的产物。PR run 构建的
        # 是合并预演提交，每周定时与手动 run 也不是上线来源；上面几步照跑，只是不上传。
        # 留 30 天：上线都是合并后不久就取；回滚靠服务器上的旧树存档，不靠这份。
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: nmu-release-artifacts
          path: ${{ runner.temp }}/nmu-release-artifacts
          if-no-files-found: error
          retention-days: 30
