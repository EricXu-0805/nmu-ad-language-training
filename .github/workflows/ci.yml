# 合并前的自动检查。Python/Node 依赖由 workflow 先准备，判据则调用
# scripts/ci_gate.sh 的共享 suite；该脚本不会改写当前 Python 或 node_modules。
# 因此同一套核心检查在本地和 CI 不会各写一份。
#
# 这个文件只是门禁定义，不能证明 GitHub 已把它设为 required check，也不能证明
# 当前 SHA 曾经跑绿；这两件事必须以仓库设置和对应 SHA 的云端运行证据为准。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC 重跑一次。依赖没动，OSV 里的世界会动——
    # 只在 push 时扫等于假设漏洞只在改代码时出现。
    - cron: "0 2 * * 1"

permissions:
  contents: read

# 第三方 action 一律按 commit SHA 钉，tag 只作注释。理由和底座镜像钉 digest
# 是同一条：tag 可以被移动，被移动之后没有任何本地信号。这些 action 在 CI 里
# 拿得到仓库内容，是供应链的一部分，不能比依赖松。

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = 容器底座；3.14 = 裸机生产机上自编译的解释器。
        # 只验一个等于放任另一条路悄悄漂。
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: 按哈希锁装运行期依赖
        run: pip install --require-hashes -r requirements-deploy.lock.txt
      - name: 装测试工具（不在运行期锁里，故单独一步）
        # 版本钉死,理由与 action 按 SHA 钉同一条:未钉的最新 ruff 会带着本地
        # 从未验证过的新规则进来(首绿尝试就是这样红的——I001 只在 CI 出现)。
        # 升级 = 本地先升、先绿,再改这里。
        run: pip install pytest==9.1.1 ruff==0.15.15
      - name: 共享后端门（ruff + pytest）
        run: NMU_GATE_PYTHON=python scripts/ci_gate.sh --only backend
      - name: 生成 240 场机械容量验收回执（留档用）
        if: matrix.python == '3.12'
        run: |
          receipt_dir="$RUNNER_TEMP/quality-scale-receipt"
          install -d -m 700 "$receipt_dir"
          python -m harness.quality_release_scale --profile full \
            --receipt "$receipt_dir/quality-release-scale.json"
      - name: 归档 240 场验收回执
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: quality-release-scale-python-3.12
          path: ${{ runner.temp }}/quality-scale-receipt/quality-release-scale.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          # 必须与本地共享门一致为 25.x：测试用 node --test 直接跑 .ts（原生类型剥离），且渲染类
          # 测试用到 node 25 起默认可用的 localStorage（24 上直接 ReferenceError，
          # 首绿尝试就是这么红的）。本地验证环境即 node 25。
          # 镜像底座是 node 22，那一层只跑 vite build，不跑这些测试。
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: 共享前端门（含 Node major 对齐）
        run: scripts/ci_gate.sh --only frontend

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - name: 共享供应链门（SBOM + OSV + 锁自洽）
        run: NMU_GATE_PYTHON=python scripts/ci_gate.sh --only supply-chain
      - name: 归档 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    # 镜像里的系统包 OSV 查不了(它认不了 OCI digest)，得在构建产物上扫。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: 构建镜像（底座 digest 已在 Dockerfile 里钉死）
        run: docker build -t nmu-platform:ci .
      - name: 扫镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: nmu-platform:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
