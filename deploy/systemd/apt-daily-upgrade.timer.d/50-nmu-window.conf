# 装到 /etc/systemd/system/apt-daily-upgrade.timer.d/50-nmu-window.conf，然后 daemon-reload。
# 发行版自带的是 06:00 UTC 起随机推迟最多 1 小时，即上海 14:00–15:00，正是有人练的时候。
# 改到 18:00 UTC（上海 02:00、芝加哥白天），9 天的现场数据里 00:00–09:30 上海时间一次
# 训练都没有；离 19:30 的 nmu-backup 一个半小时。
# Persistent=false：错过就等第二天，白天开机不会补装。
# OnCalendar 在片段里是追加，先写一行空的把自带的清掉。
[Timer]
OnCalendar=
OnCalendar=*-*-* 18:00:00
RandomizedDelaySec=5min
Persistent=false
