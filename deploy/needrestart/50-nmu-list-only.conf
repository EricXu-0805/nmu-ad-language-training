# 装到 /etc/needrestart/conf.d/50-nmu-list-only.conf（root:root 0644）。
# needrestart 在每次 apt 装完后由 99needrestart 钩子调起。默认交互模式在有终端时
# 会把 nmu、sing-box、nginx、ssh 都预先勾上重启：在 ssh 里手敲一次 apt upgrade、
# 一路回车，就是在有人练的时候重启 nmu、把走 sing-box 的人全断开。改成只列出来，
# 谁什么时候重启由人定（os_security_check 会点名还跑在旧库上的 nmu/nginx）。
$nrconf{restart} = 'l';
