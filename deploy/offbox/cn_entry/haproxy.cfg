# NMU 国内入口:openclaw-prod(147.182.176.237)的 haproxy,把 :443 的 TCP 原样转给 box A。
# 与 11-03 手装的那份只差 server 行的 send-proxy-v2:box A 的 Caddy 从 PROXY v2 头里拿真实
# 客户端地址,限速、PIN 锁定、异地探针的 /health 计数不再把国内用户全算成 droplet。
# box A 要先装 boxa-caddy-global.snippet,回滚反过来;装、核、回滚都走 install_cn_entry.sh。
global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 512
defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 10m
    timeout server 10m
frontend nmu_cn_entry
    bind 147.182.176.237:443
    default_backend nmu_box_a
backend nmu_box_a
    server box_a 89.208.253.119:443 send-proxy-v2
